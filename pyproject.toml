[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dexvantage"
dynamic = ["version"]
description = "Camera, depth and teleop planning for robot-learning data collection: place the cameras, prove what they see at the grasp, check the recorded data"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.5",
    "numpy>=1.24",
    "scipy>=1.10",
    "PyOpenGL>=3.1",
    "PyYAML>=6.0",
    "opencv-python>=4.7",
    "mujoco>=3.1",
    "certifi",
]

[project.optional-dependencies]
pin = ["pin"]                     # pinocchio: a second kinematics backend and a validation reference (Phase 1)
usd = ["usd-core==26.8"]          # OpenUSD import and export (Isaac camera prims: core/exporters/isaac.py)
lerobot = ["pyarrow", "av"]       # LeRobot Parquet and AV1/MP4 (Phase 8)
bags = ["zstandard", "lz4"]       # compressed ROS 2 bags (MCAP chunks)
assistant = ["anthropic==2.6.0", "keyring==25.7.0"]   # the Assistant dock: Claude provider, keys in the OS keyring
rerun = ["rerun-sdk==0.42.0"]     # the Rerun bridge (core/bridges/rerun.py, written against 0.42.0)
step = ["gmsh==4.15.2"]           # bracket STEP export as a faceted solid (core/exporters/bridges.py)
research = ["pandas==2.3.3"]     # the Python API's Result.to_frame() as a DataFrame (dexvantage/api.py)
tracking = ["mlflow-skinny==3.17.2", "wandb==0.30.0"]   # the experiment tracker: its mlruns/ export read back by
                                  # MLflow's client (a test), the W&B replay script (core/tracking)
bundle = ["fast-simplification==0.2.0",  # scripts/bundle_samples.py: the G1 sample's mesh simplification
          "pyinstaller==6.22.3", "pyinstaller-hooks-contrib==2026.9"]  # packaging/: the downloadable app
test = ["pytest", "jsonschema", "ruff", "mcap", "protobuf",  # mcap, protobuf: test references (bags, RLDS)
        "scikit-image==0.26.0"]   # the SSIM reference of validation check splat.ssim_vs_skimage (BSD-3)
dev = ["setuptools==84.2.1"]      # the plugin template's real pip install test (tests/test_plugins.py); MIT
site = ["markdown-it-py==4.2.0", "pillow==13.0.0"]  # scripts/build_site.py: Markdown → the website's pages (MIT),
                                  # screenshots → JPEG (MIT-CMU); its --check needs neither
splat = ["torch==2.14.1", "torchvision==0.29.1", "lpips==0.1.4"]  # robot-aligned 3DGS (core/sim/splat_rig.py,
                                  # splat_views.py, spec §9.3); torch and torchvision BSD-3, lpips BSD-2 (LPIPS:
                                  # AlexNet weights download at run time, asked first). The CUDA 13.0 build:
                                  # --extra-index-url https://download.pytorch.org/whl/cu130 (+cu130, sm_75 to sm_120;
                                  # 4,689 MB installed). gsplat is optional and not pinned (docs/models/splat.md)

[project.urls]
Source = "https://github.com/Sherin-SEF-AI/DexVantage"
Changelog = "https://github.com/Sherin-SEF-AI/DexVantage/blob/main/CHANGELOG.md"

[project.scripts]
dexvantage = "dexvantage.app:main"

[project.gui-scripts]
dexvantage-gui = "dexvantage.app:main"

[tool.setuptools.dynamic]
version = { attr = "dexvantage.__version__" }

[tool.setuptools.packages.find]
include = ["dexvantage", "dexvantage.*"]

[tool.setuptools.package-data]
dexvantage = ["resources/fonts/*.ttf", "resources/fonts/OFL.txt", "resources/icons/*.png", "resources/*.json",
              "resources/library/**", "resources/robots/**", "resources/usd_robots/**", "validation/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# ANN (flake8-annotations): spec §16 "type hints on public functions": parameters, *args, **kwargs and public return
# types, checked in the modules below only (the rest of the codebase is listed as open in docs/BUILD_STATE.md)
select = ["E", "F", "W", "ANN001", "ANN002", "ANN003", "ANN201", "ANN206"]
ignore = ["E741", "E731"]

[tool.ruff.lint.per-file-ignores]
"!dexvantage/{api.py,api_research.py,api_cluster.py,plugin_sdk.py,core/metrics.py,core/factors.py,core/exporters/__init__.py,core/stats.py,core/tracking/__init__.py}" = ["ANN"]
# ported from Vantage with their formatting kept (spec §2: copy, adapt only what is automotive)
"dexvantage/ui/{theme,icon_data,charts,widgets,viewport3d,render_gl,navigation,colormaps}.py" = ["E501", "E702", "F841"]
"dexvantage/ui/dialogs/{base,palette}.py" = ["E501"]
"dexvantage/core/{mathutil,provenance}.py" = ["E501"]
"dexvantage/workdir.py" = ["E501"]
